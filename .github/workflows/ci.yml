name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run check:worker
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: ci.db
      - name: build the Cloudflare demo and dry-run its deploy bundle
        run: npm run demo:build && npx wrangler deploy -c wrangler.demo.jsonc --dry-run --outdir dist-demo

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image (adapter-node) build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build the image
        run: docker compose build
      - name: start with demo data and wait for the health check
        run: docker compose up -d --wait --wait-timeout 120
      - name: smoke test (page, language, migrations, seeded sign-in)
        run: |
          curl -fsS http://localhost:3000/login | grep -q 'Sign in'
          curl -fsS -H 'Accept-Language: ms' http://localhost:3000/login | grep -q '<html lang="ms"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: http://localhost:3000' -H 'Accept: text/html' \
            --data-urlencode 'email=demo@biliksewa.test' --data-urlencode 'password=demo-landlord' \
            http://localhost:3000/login)
          test "$code" = 303
          docker compose exec -T app id -un | grep -qx node
      - name: container logs
        if: always()
        run: docker compose logs
      - name: stop
        if: always()
        run: docker compose down -v
